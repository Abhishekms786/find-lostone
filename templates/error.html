{% extends 'base.html' %}
{% block title %}Error – FindIt{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-content">
    <div class="error-code">⚠️</div>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-message">{{ message or 'An unexpected error occurred. Please try again.' }}</p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Go Home</a>
    </div>
  </div>
</div>
{% endblock %}
